    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const templateName = document.documentElement.getAttribute('data-template') || 'vertical-menu-template-no-customizer';
        const themeKey = 'templateCustomizer-' + templateName + '--Theme';
        const savedTheme = localStorage.getItem(themeKey);
        const savedRememberUser = localStorage.getItem('tpv_remember_usuario');
        const savedRememberMe = localStorage.getItem('tpv_remember_me');
        localStorage.clear();
        if (savedTheme) {
          localStorage.setItem(themeKey, savedTheme);
        }
        if (savedRememberUser) {
          localStorage.setItem('tpv_remember_usuario', savedRememberUser);
        }
        if (savedRememberMe) {
          localStorage.setItem('tpv_remember_me', savedRememberMe);
        }

        const usuarioInput = document.getElementById('usuario');
        const rememberCheckbox = document.getElementById('remember-me');
        if (usuarioInput && !usuarioInput.value && savedRememberUser) {
          usuarioInput.value = savedRememberUser;
        }
        if (rememberCheckbox && savedRememberMe === '1') {
          rememberCheckbox.checked = true;
        }

        const loginForm = document.getElementById('formAuthentication');
        if (loginForm) {
          loginForm.addEventListener('submit', function () {
            const usuario = usuarioInput ? usuarioInput.value.trim() : '';
            const recordar = rememberCheckbox && rememberCheckbox.checked;
            if (recordar && usuario) {
              localStorage.setItem('tpv_remember_usuario', usuario);
              localStorage.setItem('tpv_remember_me', '1');
            } else {
              localStorage.removeItem('tpv_remember_usuario');
              localStorage.removeItem('tpv_remember_me');
            }
          });
        }
        const loaderContainer = document.getElementById('loaderContainer');
        const mainContent = document.getElementById('mainContent');
        
        function hideLoader() {
          loaderContainer.classList.add('hidden');
          mainContent.classList.add('loaded');
          
          setTimeout(() => {
            if (loaderContainer.parentNode) {
              loaderContainer.parentNode.removeChild(loaderContainer);
            }
          }, 300);
        }
        
        function checkDependencies() {
          if (typeof $ !== 'undefined') {
            if (typeof bootstrap !== 'undefined') {
              if (typeof FormValidation !== 'undefined') {
                hideLoader();
                return;
              }
            }
          }
          
          setTimeout(checkDependencies, 100);
        }
        
        setTimeout(checkDependencies, 500);
        
        setTimeout(hideLoader, 5000);
      });
    </script>
